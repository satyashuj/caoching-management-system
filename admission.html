<style>

body{

  /* BODY */
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}

/* MAIN CONTAINER */
.container{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:40px;
    flex-wrap:wrap;
    padding:50px 20px;
}

/* FORM BOX */
.formBox{
    width:380px;
    padding:30px;
    border-radius:25px;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);

    /* COLORFUL GLOW */
    box-shadow:
        0 0 15px #00c3ff,
        0 0 30px #6a5acd,
        0 0 45px #ff4d6d;

    animation:glow 4s linear infinite;
}

/* ID CARD BOX */
.cardBox{
    width:320px;
    padding:30px;
    border-radius:25px;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);

    box-shadow:
        0 0 15px #22c55e,
        0 0 30px #00c3ff,
        0 0 45px #ff4d6d;

    animation:glow 4s linear infinite;
}

/* ANIMATION */
@keyframes glow{
    0%{
        filter:hue-rotate(0deg);
    }

    100%{
        filter:hue-rotate(360deg);
    }
}

/* HEADINGS */
.formBox h2,
.cardBox h2{
    text-align:center;
    margin-bottom:25px;
    font-size:32px;

    text-shadow:
        0 0 10px #00c3ff,
        0 0 20px #ff4d6d;
}

/* INPUTS */
form input,
form textarea{
    width:100%;
    padding:14px;
    margin:12px 0;
    border:none;
    border-radius:12px;
    outline:none;

    background:rgba(255,255,255,0.12);
    color:white;
    font-size:16px;

    box-shadow:
        0 0 10px rgba(0,195,255,0.3);

    transition:0.3s;
}

/* INPUT FOCUS */
form input:focus,
form textarea:focus{
    transform:scale(1.02);

    box-shadow:
        0 0 15px #00c3ff,
        0 0 30px #ff4d6d;
}

/* PLACEHOLDER */
::placeholder{
    color:#d1d5db;
}

/* BUTTON */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:40px;

    background:linear-gradient(45deg,#00c3ff,#6a5acd,#ff4d6d);

    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;

    box-shadow:
        0 0 15px rgba(0,195,255,0.5);

    transition:0.4s;
}

/* BUTTON HOVER */
button:hover{
    transform:scale(1.05);

    box-shadow:
        0 0 20px #00c3ff,
        0 0 40px #6a5acd,
        0 0 60px #ff4d6d;
}

/* ID CARD */
#idCard{
    text-align:center;
    padding:20px;
    border-radius:20px;

    background:rgba(255,255,255,0.1);

    box-shadow:
        0 0 15px rgba(255,255,255,0.2);
}

/* PHOTO */
#cardPhoto{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:50%;
    margin-bottom:15px;

    border:4px solid #00c3ff;

    box-shadow:
        0 0 20px #00c3ff,
        0 0 40px #ff4d6d;
}

/* NAME */
#cardName{
    font-size:28px;
    margin-bottom:10px;

    color:#00c3ff;

    text-shadow:
        0 0 10px #00c3ff;
}

/* TEXT */
#cardClass,
#cardId{
    font-size:18px;
    margin:8px 0;
}

/* MESSAGE */
#msg{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
    color:#22c55e;
}

/* MOBILE */
@media(max-width:768px){

.container{
    flex-direction:column;
    align-items:center;
}

.formBox,
.cardBox{
    width:90%;
}

}

button{
background:#28a745;
color:white;
padding:10px 20px;
border:none;
cursor:pointer;
}

.cardBox{
background:white;
padding:25px;
width:260px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
text-align:center;
}

#idCard{
border:2px solid #2c7be5;
padding:15px;
display:none;
}

#idCard img{
width:100px;
height:100px;
object-fit:cover;
border-radius:5px;
}

footer{
background:#222;
color:white;
text-align:center;
padding:15px;
}

</style>

<script>

/* EmailJS */

(function(){
emailjs.init("C0XgzTh8sivaWP-WG");

/* PHOTO LOAD */

document.getElementById("cardId").innerHTML="Student ID : "+studentId;

document.getElementById("idCard").style.display="block";

"service_a80cusb",
