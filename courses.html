<!DOCTYPE html>

<title>Courses</title>

<style>

body{font-family:Arial;margin:0;background:#f4f4f4;}

header{background:#2c7be5;color:white;text-align:center;padding:20px;}

nav{background:#333;padding:12px;text-align:center;}

nav a{color:white;margin:15px;text-decoration:none;font-weight:bold;}

section{padding:40px;text-align:center;}

.course{
background:white;
margin:15px;
padding:20px;
display:inline-block;
width:220px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}
/* SECTION */
section{
    padding: 40px;
    text-align: center;
}

/* HEADING */
h2{
    font-size: 36px;
    color: #ffffff;
    margin-bottom: 30px;

    /* GLOW */
    text-shadow:
        0 0 10px #00c3ff,
        0 0 20px #00c3ff,
        0 0 35px rgba(0,195,255,0.7);
}

/* COURSE CARD */
.course{
    background: linear-gradient(135deg,#2563eb,#1e3a8a);
    color: white;
    width: 300px;
    margin: 20px auto;
    padding: 25px;
    border-radius: 18px;

    /* GLOW */
    box-shadow:
        0 0 15px rgba(0,195,255,0.4),
        0 0 30px rgba(0,195,255,0.2);

    transition: 0.4s ease;
}

/* HOVER EFFECT */
.course:hover{
    transform: translateY(-10px) scale(1.03);

    box-shadow:
        0 0 20px #00c3ff,
        0 0 40px #00c3ff,
        0 0 60px rgba(0,195,255,0.8);
}

/* COURSE TITLE */
.course h3{
    font-size: 24px;
    margin-bottom: 15px;
}

/* COURSE TEXT */
.course p{
    font-size: 16px;
    line-height: 1.6;
}

/* TIME BOX */
.Time{
    margin-top: 30px;
}

/* TIME TEXT */
.time{
    display: inline-block;
    padding: 15px 30px;
    border-radius: 40px;
    background: linear-gradient(45deg,#00c3ff,#2563eb);
    color: white;
    font-size: 22px;
    font-weight: bold;

    /* GLOW */
    box-shadow:
        0 0 15px rgba(0,195,255,0.5),
        0 0 35px rgba(0,195,255,0.4);

    transition: 0.3s;
}

/* TIME HOVER */
.time:hover{
    transform: scale(1.08);

    box-shadow:
        0 0 20px #00c3ff,
        0 0 45px #00c3ff;
}
.time{
color:#2c7be5;
margin:15px;
padding:20px;
display:inline-block;
width:220px;

font-weight:bold;
box-shadow:0 0 10px rgba(0,0,0,0.1);
padding:15px;
border-radius:10px;
}

footer{background:#222;color:white;text-align:center;padding:15px;}

</style>
